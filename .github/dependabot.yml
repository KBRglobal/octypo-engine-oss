version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /admin
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /blog
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
