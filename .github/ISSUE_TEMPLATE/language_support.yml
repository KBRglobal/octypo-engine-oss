name: Language problem
description: Output in a language is wrong or reads badly
labels: [language]
body:
  - type: input
    id: language
    attributes:
      label: Language and country
      placeholder: ja, JP
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model used
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Include a short sample of the text, and how a native speaker would write it.
    validations:
      required: true
